<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- Discord masks server icons into a rounded squircle, so the dark background is full-bleed here (unlike cal-logo.svg's rx=6) to avoid transparent corners after masking. Artwork matches the navbar / loading CAL wordmark. -->
  <rect width="32" height="32" fill="#111827"/>
  <g fill="#ffffff">
    <rect x="5" y="8" width="2" height="2"/><rect x="7" y="8" width="2" height="2"/><rect x="9" y="8" width="2" height="2"/>
    <rect x="5" y="10" width="2" height="2"/>
    <rect x="5" y="12" width="2" height="2"/>
    <rect x="5" y="14" width="2" height="2"/>
    <rect x="5" y="16" width="2" height="2"/><rect x="7" y="16" width="2" height="2"/><rect x="9" y="16" width="2" height="2"/>
    <rect x="13" y="8" width="2" height="2"/><rect x="15" y="8" width="2" height="2"/><rect x="17" y="8" width="2" height="2"/>
    <rect x="13" y="10" width="2" height="2"/><rect x="17" y="10" width="2" height="2"/>
    <rect x="13" y="12" width="2" height="2"/><rect x="15" y="12" width="2" height="2"/><rect x="17" y="12" width="2" height="2"/>
    <rect x="13" y="14" width="2" height="2"/><rect x="17" y="14" width="2" height="2"/>
    <rect x="13" y="16" width="2" height="2"/><rect x="17" y="16" width="2" height="2"/>
    <rect x="21" y="8" width="2" height="2"/>
    <rect x="21" y="10" width="2" height="2"/>
    <rect x="21" y="12" width="2" height="2"/>
    <rect x="21" y="14" width="2" height="2"/>
    <rect x="21" y="16" width="2" height="2"/><rect x="23" y="16" width="2" height="2"/><rect x="25" y="16" width="2" height="2"/>
  </g>
  <g fill="#0ea5e9">
    <rect x="5" y="20" width="22" height="2"/>
    <rect x="7" y="22" width="18" height="2"/>
  </g>
</svg>
