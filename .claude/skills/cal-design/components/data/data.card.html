<!-- @dsCard group="Components" viewport="700x190" name="StatBlock" subtitle="Display figure over a mono caps label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--cal-bg); padding:28px;
         display:flex; gap:48px; align-items:flex-end; }
  .v { font-family:var(--cal-font-display); font-weight:900; font-size:44px; line-height:1;
       letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
  .l { font-family:var(--cal-font-mono); font-weight:600; font-size:11px; letter-spacing:0.24em;
       text-transform:uppercase; color:var(--cal-text-faint); margin-top:6px; }
  .b { display:flex; flex-direction:column; }
</style>
</head>
<body>
  <div class="b"><span class="v" style="color:var(--cal-text)">24</span><span class="l">Matches</span></div>
  <div class="b"><span class="v" style="color:var(--cal-cyan)">18–6</span><span class="l">Record</span></div>
  <div class="b"><span class="v" style="color:var(--cal-magenta)">3</span><span class="l">Titles</span></div>
  <div class="b"><span class="v" style="color:var(--cal-text)">12.4k</span><span class="l">Avg viewers</span></div>
</body>
</html>
