<!-- @dsCard group="Components" viewport="700x220" name="GlitchText" subtitle="The signature RGB-split wordmark treatment" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--cal-bg); padding:32px 28px;
         display:flex; flex-direction:column; gap:18px; }
  .glitch { font-family:var(--cal-font-display); font-weight:900; text-transform:uppercase;
            color:var(--cal-text); letter-spacing:-0.01em; line-height:1.02; margin:0; }
  .lbl { font-family:var(--cal-font-mono); font-size:10px; letter-spacing:0.24em;
         text-transform:uppercase; color:var(--cal-text-faint); }
</style>
</head>
<body>
  <span class="lbl">Wordmark · 76px</span>
  <h1 class="glitch" style="font-size:76px; text-shadow:-3.5px 0 0 rgba(0,229,255,.9), 3.5px 0 0 rgba(255,46,152,.9)">CAL</h1>
  <span class="lbl">Hero headline · 34px</span>
  <h2 class="glitch" style="font-size:34px; text-shadow:-2px 0 0 rgba(0,229,255,.85), 2px 0 0 rgba(255,46,152,.85)">The glitch, distilled.</h2>
</body>
</html>
