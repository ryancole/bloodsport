<!-- @dsCard group="Components" viewport="700x200" name="Input" subtitle="Dark field with cyan focus ring" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--cal-bg); padding:28px; display:flex; gap:24px; }
  .field { display:flex; flex-direction:column; gap:8px; width:240px; }
  .l { font-family:var(--cal-font-mono); font-weight:600; font-size:11px; letter-spacing:0.18em;
       text-transform:uppercase; color:var(--cal-text-faint); }
  .i { height:44px; padding:0 14px; background:var(--cal-surface-1); color:var(--cal-text);
       border:1px solid var(--cal-border-strong); border-radius:var(--cal-radius-sm);
       font-family:var(--cal-font-body); font-size:15px; }
  .i.focus { border-color:var(--cal-cyan); box-shadow:0 0 0 3px var(--cal-cyan-ghost); }
  .i.mono { font-family:var(--cal-font-mono); }
  .hint { font-size:12px; color:var(--cal-text-faint); }
</style>
</head>
<body>
  <div class="field">
    <span class="l">Team name</span>
    <div class="i" style="display:flex;align-items:center;color:var(--cal-text-muted)">Neon Foxes</div>
  </div>
  <div class="field">
    <span class="l">Invite code</span>
    <div class="i mono focus" style="display:flex;align-items:center">CAL-7F2K<span style="width:1px;height:18px;background:var(--cal-cyan);margin-left:2px"></span></div>
    <span class="hint">6 characters · focused</span>
  </div>
</body>
</html>
