<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Champions Amateur League</title>
<link rel="icon" type="image/svg+xml" href="../../assets/logo/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  #app { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>

<script type="text/babel" src="./TopNav.jsx"></script>
<script type="text/babel" src="./Dashboard.jsx"></script>
<script type="text/babel" src="./Screens.jsx"></script>
<script type="text/babel" src="./Playoffs.jsx"></script>

<script type="text/babel">
  const { useState } = React;

  function Placeholder({ title, body }) {
    return (
      <div>
        <h1 style={{ margin: '0 0 12px', fontFamily: 'var(--cal-font-heading)', fontSize: 34, fontWeight: 700, letterSpacing: '-0.01em', color: 'var(--cal-text)', borderLeft: '4px solid var(--cal-magenta)', paddingLeft: 12 }}>{title}</h1>
        <p style={{ maxWidth: 620, color: 'var(--cal-text-muted)', lineHeight: 1.65, fontSize: 14 }}>{body}</p>
      </div>
    );
  }

  function Footer() {
    return (
      <footer style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', maxWidth: 1200, width: '100%', margin: '24px auto 0', padding: '18px 24px', borderTop: '1px solid var(--cal-border)', fontFamily: 'var(--cal-font-mono)', fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--cal-text-faint)' }}>
        <span style={{ fontWeight: 600, color: 'var(--cal-text-muted)' }}>Champions Amateur League</span>
        <span style={{ textAlign: 'center' }}>r/caleague</span>
        <span style={{ textAlign: 'right', cursor: 'pointer' }}>Back to top</span>
      </footer>
    );
  }

  function App() {
    const [route, setRoute] = useState('dashboard');
    const nav = (r) => { setRoute(r); window.scrollTo(0, 0); };

    // map top-nav keys to active highlight
    const activeKey = route.startsWith('season') ? 'seasons' : route === 'dashboard' ? '' : route;

    let screen;
    if (route === 'dashboard') screen = <Dashboard onNavigate={nav} />;
    else if (route === 'news') screen = <News />;
    else if (route === 'teams') screen = <Teams onNavigate={nav} />;
    else if (route === 'seasons') screen = <Seasons onNavigate={nav} />;
    else if (route.startsWith('season:')) screen = <SeasonDetail seasonId={parseInt(route.split(':')[1], 10)} onNavigate={nav} />;
    else if (route === 'playoffs') screen = <Playoffs onNavigate={nav} />;
    else if (route === 'format') screen = <Placeholder title="Format" body="Regular season matchups are best-of-one. Each week, teams are paired against one opponent and play a single game. At the close of the season, the largest power of two that fits the field qualifies for a clean, bye-free playoff bracket seeded by win–loss record." />;
    else if (route === 'rules') screen = <Placeholder title="Rules" body="The official CAL ruleset, organized in numbered clauses (1.00 Regular Season, 2.00 Playoffs, 4.00 Tiebreakers). Seeding ties are broken by head-to-head result, then total game time, then an admin-administered coin flip (4.10)." />;
    else screen = <Placeholder title="Users" body="Every registered summoner, their linked Riot accounts, and the teams they roster on." />;

    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
        <TopNav active={activeKey} onNavigate={nav} />
        <main style={{ flex: 1, maxWidth: 1200, width: '100%', margin: '0 auto', padding: '24px' }}>
          {screen}
        </main>
        <Footer />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
