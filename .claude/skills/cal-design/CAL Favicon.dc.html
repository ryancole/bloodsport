<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; }
</style>
</helmet>
<div style="min-height:100vh; background:#0B0E14; color:#F4F5F7; font-family:'Archivo',sans-serif; display:flex; flex-direction:column; align-items:center; padding:64px 24px 80px; box-sizing:border-box;">

  <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.32em; color:#5b6373; text-transform:uppercase; margin-bottom:48px;">CAL · favicon.ico</div>

  <!-- HERO -->
  <div style="display:flex; align-items:center; gap:56px; flex-wrap:wrap; justify-content:center; margin-bottom:72px;">
    <canvas ref="{{ heroRef }}" width="640" height="640" style="width:300px; height:300px; image-rendering:auto; border-radius:24px; box-shadow:0 24px 60px rgba(0,0,0,0.5);"></canvas>
    <div style="max-width:300px;">
      <div style="font-weight:900; font-size:34px; line-height:1.05; letter-spacing:-0.01em;">The glitch, distilled.</div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.9; color:#8b93a3; margin-top:20px;">
        <div><span style="display:inline-block; width:12px; height:12px; background:#00E5FF; border-radius:2px; vertical-align:-1px; margin-right:8px;"></span>cyan &nbsp;#00E5FF</div>
        <div><span style="display:inline-block; width:12px; height:12px; background:#FF2E98; border-radius:2px; vertical-align:-1px; margin-right:8px;"></span>magenta #FF2E98</div>
        <div><span style="display:inline-block; width:12px; height:12px; background:#F4F5F7; border-radius:2px; vertical-align:-1px; margin-right:8px;"></span>white &nbsp;#F4F5F7</div>
        <div><span style="display:inline-block; width:12px; height:12px; background:#0B0E14; border:1px solid #2a2f3a; border-radius:2px; vertical-align:-1px; margin-right:8px;"></span>tile &nbsp;&nbsp;#0B0E14</div>
      </div>
    </div>
  </div>

  <!-- TRUE SIZES -->
  <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.24em; color:#5b6373; text-transform:uppercase; margin-bottom:28px;">actual rendered sizes</div>
  <div style="display:flex; align-items:flex-end; gap:48px; margin-bottom:72px;">
    <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="4">
      <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
        <canvas ref="{{ s.ref }}" width="{{ s.px }}" height="{{ s.px }}" style="image-rendering:auto;"></canvas>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#8b93a3;">{{ s.label }}</div>
      </div>
    </sc-for>
  </div>

  <!-- BROWSER TAB MOCKUP -->
  <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.24em; color:#5b6373; text-transform:uppercase; margin-bottom:24px;">in context</div>
  <div style="display:flex; gap:32px; flex-wrap:wrap; justify-content:center;">

    <!-- dark tab -->
    <div style="width:300px; background:#202124; border-radius:10px 10px 0 0; padding:8px 8px 0; box-shadow:0 16px 40px rgba(0,0,0,0.4);">
      <div style="display:flex; align-items:center; gap:9px; background:#35363a; border-radius:8px 8px 0 0; padding:9px 12px; max-width:200px;">
        <canvas ref="{{ tabDarkRef }}" width="32" height="32" style="width:16px; height:16px;"></canvas>
        <span style="font-family:'Archivo',sans-serif; font-size:12.5px; color:#e8eaed; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Champions Amateur League</span>
        <span style="margin-left:auto; color:#9aa0a6; font-size:14px;">×</span>
      </div>
    </div>

    <!-- light tab -->
    <div style="width:300px; background:#dee1e6; border-radius:10px 10px 0 0; padding:8px 8px 0; box-shadow:0 16px 40px rgba(0,0,0,0.4);">
      <div style="display:flex; align-items:center; gap:9px; background:#ffffff; border-radius:8px 8px 0 0; padding:9px 12px; max-width:200px;">
        <canvas ref="{{ tabLightRef }}" width="32" height="32" style="width:16px; height:16px;"></canvas>
        <span style="font-family:'Archivo',sans-serif; font-size:12.5px; color:#3c4043; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Champions Amateur League</span>
        <span style="margin-left:auto; color:#5f6368; font-size:14px;">×</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.heroRef = React.createRef();
    this.tabDarkRef = React.createRef();
    this.tabLightRef = React.createRef();
    this.sizes = [16,32,48,64].map(px => ({ px, label: px + ' × ' + px, ref: React.createRef() }));
  }

  // Draw the favicon at a given pixel size into ctx.
  // tile=false skips the dark background (transparent variant).
  draw(ctx, S, tile){
    ctx.clearRect(0,0,S,S);
    ctx.save();

    if(tile !== false){
      const r = S*0.18;
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.arcTo(S,0,S,S,r); ctx.arcTo(S,S,0,S,r);
      ctx.arcTo(0,S,0,0,r); ctx.arcTo(0,0,S,0,r); ctx.closePath();
      ctx.fillStyle = '#0B0E14';
      ctx.fill();
    }

    const cx = S/2, cy = S/2;
    const radius = S*0.295;
    const lw = Math.max(2, S*0.16);
    const gap = 0.66;                 // half-opening on the right
    const start = gap, end = Math.PI*2 - gap;
    const off = Math.max(1, S*0.052); // chromatic split distance

    ctx.lineWidth = lw;
    ctx.lineCap = 'butt';

    const arc = (dx, color) => {
      ctx.beginPath();
      ctx.arc(cx + dx, cy, radius, start, end, false);
      ctx.strokeStyle = color;
      ctx.stroke();
    };

    arc(-off, '#00E5FF');  // cyan left
    arc( off, '#FF2E98');  // magenta right
    arc( 0,   '#F4F5F7');  // white centre on top

    ctx.restore();
  }

  componentDidMount(){
    const h = this.heroRef.current;
    if(h) this.draw(h.getContext('2d'), h.width, true);

    this.sizes.forEach(s => {
      const c = s.ref.current;
      if(c) this.draw(c.getContext('2d'), s.px, true);
    });

    const td = this.tabDarkRef.current;
    if(td) this.draw(td.getContext('2d'), td.width, true);
    const tl = this.tabLightRef.current;
    if(tl) this.draw(tl.getContext('2d'), tl.width, true);
  }

  renderVals(){
    return {
      heroRef: this.heroRef,
      tabDarkRef: this.tabDarkRef,
      tabLightRef: this.tabLightRef,
      sizes: this.sizes
    };
  }
}
</script>
</body>
</html>
