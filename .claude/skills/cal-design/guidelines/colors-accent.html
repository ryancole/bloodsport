<!-- @dsCard group="Colors" viewport="700x160" name="Brand Accents" subtitle="The two-tone glitch — cyan, magenta, and the split gradient" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cal-bg);padding:22px;display:flex;gap:14px;font-family:var(--cal-font-mono)}
  .sw{flex:1;border-radius:var(--cal-radius-sm);padding:12px;height:88px;display:flex;flex-direction:column;justify-content:flex-end}
  .n{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600}
  .h{font-size:10px;margin-top:3px;opacity:0.85}
</style></head><body>
  <div class="sw" style="background:var(--cal-cyan)"><span class="n" style="color:#06121a">cyan</span><span class="h" style="color:#06121a">#00E5FF</span></div>
  <div class="sw" style="background:var(--cal-magenta)"><span class="n" style="color:#1a0610">magenta</span><span class="h" style="color:#1a0610">#FF2E98</span></div>
  <div class="sw" style="background:var(--cal-gradient)"><span class="n" style="color:#0b0e14">gradient</span><span class="h" style="color:#0b0e14">cyan → magenta</span></div>
  <div class="sw" style="background:var(--cal-cyan-ghost);border:1px solid var(--cal-cyan)"><span class="n" style="color:var(--cal-cyan)">cyan-ghost</span><span class="h" style="color:var(--cal-cyan)">12% tint</span></div>
  <div class="sw" style="background:var(--cal-magenta-ghost);border:1px solid var(--cal-magenta)"><span class="n" style="color:var(--cal-magenta)">mag-ghost</span><span class="h" style="color:var(--cal-magenta)">12% tint</span></div>
</body></html>
