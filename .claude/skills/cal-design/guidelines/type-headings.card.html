<!-- @dsCard group="Type" viewport="700x190" name="Headings — Rajdhani" subtitle="Condensed uppercase headings & nav" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  h1,h2,h3 { font-family: var(--cal-font-heading); margin: 0; color: var(--cal-text); }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  h2 { font-size: 24px; font-weight: 600; }
  .nav { font-family: var(--cal-font-heading); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--cal-text-muted); margin-top: 6px; }
  .spec { font-family: var(--cal-font-mono); font-size: 11px; color: var(--cal-text-faint); margin-top: 8px; }
</style>
</head>
<body>
  <div class="stack">
    <h1>Champions Crowned</h1>
    <h2>Grand Final · Week 6</h2>
    <div class="nav">News · Teams · Seasons · Playoffs</div>
    <div class="spec">Rajdhani 600–700 · nav is uppercase, tracking 0.04em</div>
  </div>
</body>
</html>
