<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="6 / 10 / 14 / 18 / pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; }
  .row { display: flex; gap: 16px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 60px; background: var(--cal-surface-3); border: 1px solid var(--cal-border-strong); border-top: 2px solid var(--cal-cyan); }
  .pill { width: 96px; }
  .v { font-family: var(--cal-font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cal-text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:6px"></div><div class="v">XS · 6</div></div>
    <div class="col"><div class="box" style="border-radius:10px"></div><div class="v">SM · 10</div></div>
    <div class="col"><div class="box" style="border-radius:14px"></div><div class="v">MD · 14</div></div>
    <div class="col"><div class="box" style="border-radius:18px"></div><div class="v">LG · 18</div></div>
    <div class="col"><div class="box pill" style="border-radius:999px"></div><div class="v">Pill</div></div>
  </div>
</body>
</html>
