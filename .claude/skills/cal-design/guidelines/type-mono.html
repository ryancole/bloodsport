<!-- @dsCard group="Type" viewport="700x180" name="Mono — JetBrains Mono" subtitle="Labels, eyebrows, scores & data — wide uppercase tracking" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cal-bg);padding:26px;font-family:var(--cal-font-mono);color:var(--cal-text);display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-size:12px;letter-spacing:0.32em;text-transform:uppercase;color:var(--cal-text-faint)}
  .label{font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--cal-text-muted)}
  .score{font-size:40px;font-weight:700;letter-spacing:0.02em;font-variant-numeric:tabular-nums}
</style></head><body>
  <span class="eyebrow">CAL · Champions Amateur League</span>
  <span class="label">Matchday 06 · Group A · Live</span>
  <span class="score" style="color:var(--cal-text)">2 <span style="color:var(--cal-text-faint)">–</span> 1</span>
</body></html>
