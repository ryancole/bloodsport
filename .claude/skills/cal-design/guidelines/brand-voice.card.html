<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; }
  .tagline { font-family: var(--cal-font-heading); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; color: var(--cal-text); }
  .tagline em { font-style: normal; background: var(--cal-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .rule { font-family: var(--cal-font-mono); font-size: 13px; color: var(--cal-text-muted); margin-top: 16px; line-height: 1.6; }
  .clause { color: var(--cal-cyan); }
</style>
</head>
<body>
  <div class="tagline">Where summoners become <em>champions</em>.</div>
  <div class="rule"><span class="clause">2.10</span> &nbsp;Playoff matchups are best-of-one. One loss and a team is eliminated from the bracket.</div>
</body>
</html>
