<!-- @dsCard group="Colors" viewport="700x160" name="Semantic Status" subtitle="Win / loss / pending across the league" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: var(--cal-radius-md); border: 1px solid var(--cal-border); overflow: hidden; box-shadow: var(--cal-shadow-sm), var(--cal-edge-top); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: var(--cal-surface-2); }
  .name { font-family: var(--cal-font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cal-text); }
  .hex { font-family: var(--cal-font-mono); font-size: 11px; color: var(--cal-text-faint); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--cal-success)"></div><div class="meta"><div class="name">Success</div><div class="hex">#21D07A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cal-warning)"></div><div class="meta"><div class="name">Warning</div><div class="hex">#FFB020</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cal-danger)"></div><div class="meta"><div class="name">Danger</div><div class="hex">#FF4D4D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cal-info)"></div><div class="meta"><div class="name">Info</div><div class="hex">#00E5FF</div></div></div>
  </div>
</body>
</html>
