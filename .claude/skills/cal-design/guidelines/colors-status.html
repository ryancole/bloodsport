<!-- @dsCard group="Colors" viewport="700x150" name="Text & Status" subtitle="Text ramp plus functional win / loss / live colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cal-bg);padding:22px;display:flex;flex-direction:column;gap:16px;font-family:var(--cal-font-body)}
  .row{display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
  .t{font-weight:700;font-size:18px}
  .m{font-family:var(--cal-font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase}
  .chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--cal-font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase}
  .d{width:9px;height:9px;border-radius:50%}
</style></head><body>
  <div class="row">
    <span class="t" style="color:var(--cal-text)">Primary</span>
    <span class="t" style="color:var(--cal-text-muted)">Muted</span>
    <span class="t" style="color:var(--cal-text-faint)">Faint</span>
    <span class="m" style="color:var(--cal-text-faint)">#F4F5F7 · #8B93A3 · #5B6373</span>
  </div>
  <div class="row">
    <span class="chip" style="color:var(--cal-win)"><span class="d" style="background:var(--cal-win)"></span>Win</span>
    <span class="chip" style="color:var(--cal-loss)"><span class="d" style="background:var(--cal-loss)"></span>Loss</span>
    <span class="chip" style="color:var(--cal-live)"><span class="d" style="background:var(--cal-live)"></span>Live</span>
    <span class="chip" style="color:var(--cal-success)"><span class="d" style="background:var(--cal-success)"></span>Success</span>
    <span class="chip" style="color:var(--cal-warning)"><span class="d" style="background:var(--cal-warning)"></span>Warning</span>
    <span class="chip" style="color:var(--cal-danger)"><span class="d" style="background:var(--cal-danger)"></span>Danger</span>
  </div>
</body></html>
