<!-- @dsCard group="Type" viewport="700x190" name="Mono — JetBrains Mono" subtitle="Eyebrows, labels, data & codes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; }
  .stack { display: flex; flex-direction: column; gap: 11px; }
  .eyebrow { font-family: var(--cal-font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cal-text-faint); }
  .label { font-family: var(--cal-font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cal-cyan); }
  .data { font-family: var(--cal-font-mono); font-size: 15px; font-weight: 500; color: var(--cal-text); letter-spacing: 0.02em; }
  .spec { font-family: var(--cal-font-mono); font-size: 11px; color: var(--cal-text-faint); }
</style>
</head>
<body>
  <div class="stack">
    <div class="eyebrow">Recent Activity</div>
    <div class="label">Reg. Open · Best of One</div>
    <div class="data">LOBBY · 4F2A-9KQ7 &nbsp; W 5 — L 1</div>
    <div class="spec">JetBrains Mono 500–600 · always UPPERCASE, wide tracking</div>
  </div>
</body>
</html>
