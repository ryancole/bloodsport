<!-- @dsCard group="Colors" viewport="700x150" name="Ground & Surfaces" subtitle="Cool near-blacks, lightest at the top of the stack" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cal-bg);padding:22px;display:flex;gap:14px;font-family:var(--cal-font-mono)}
  .sw{flex:1;border-radius:var(--cal-radius-sm);border:1px solid var(--cal-border);padding:12px;height:78px;display:flex;flex-direction:column;justify-content:flex-end}
  .n{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cal-text)}
  .h{font-size:10px;color:var(--cal-text-faint);margin-top:3px}
</style></head><body>
  <div class="sw" style="background:var(--cal-bg)"><span class="n">bg</span><span class="h">#0B0E14</span></div>
  <div class="sw" style="background:var(--cal-surface-1)"><span class="n">surface-1</span><span class="h">#11151F</span></div>
  <div class="sw" style="background:var(--cal-surface-2)"><span class="n">surface-2</span><span class="h">#161B27</span></div>
  <div class="sw" style="background:var(--cal-surface-3)"><span class="n">surface-3</span><span class="h">#1D2433</span></div>
  <div class="sw" style="background:var(--cal-border)"><span class="n">border</span><span class="h">#232A38</span></div>
</body></html>
