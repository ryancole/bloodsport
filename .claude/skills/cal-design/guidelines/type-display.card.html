<!-- @dsCard group="Type" viewport="700x180" name="Display — Archivo Black" subtitle="Big stat numerals, gradient-filled" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; display: flex; align-items: center; gap: 28px; }
  .num { font-family: var(--cal-font-display); font-weight: 900; font-size: 88px; line-height: 1; letter-spacing: -0.02em; background: var(--cal-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .meta { display: flex; flex-direction: column; gap: 6px; }
  .lab { font-family: var(--cal-font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cal-text-faint); }
  .big { font-family: var(--cal-font-display); font-weight: 900; font-size: 26px; color: var(--cal-text); letter-spacing: -0.01em; }
  .spec { font-family: var(--cal-font-mono); font-size: 12px; color: var(--cal-text-muted); }
</style>
</head>
<body>
  <div class="num">12</div>
  <div class="meta">
    <div class="lab">Display / Stat</div>
    <div class="big">Archivo Black 900</div>
    <div class="spec">letter-spacing −0.02em · gradient clip</div>
  </div>
</body>
</html>
