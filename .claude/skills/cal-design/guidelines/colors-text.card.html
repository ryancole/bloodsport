<!-- @dsCard group="Colors" viewport="700x150" name="Text Levels" subtitle="Four-step text hierarchy on dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; }
  .stack { display: flex; flex-direction: column; gap: 9px; }
  .line { display: flex; align-items: baseline; gap: 14px; }
  .t { font-size: 18px; font-weight: 600; }
  .tag { font-family: var(--cal-font-mono); font-size: 11px; color: var(--cal-text-faint); margin-left: auto; }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="t" style="color:var(--cal-text)">Primary — match results &amp; titles</span><span class="tag">#F4F5F7</span></div>
    <div class="line"><span class="t" style="color:var(--cal-text-muted)">Muted — secondary detail</span><span class="tag">#8B93A3</span></div>
    <div class="line"><span class="t" style="color:var(--cal-text-faint)">Faint — labels &amp; meta</span><span class="tag">#5B6373</span></div>
    <div class="line"><span class="t" style="color:var(--cal-cyan)">Link — interactive cyan</span><span class="tag">#00E5FF</span></div>
  </div>
</body>
</html>
