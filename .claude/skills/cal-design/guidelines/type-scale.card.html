<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Hero → micro, in use" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; }
  .stack { display: flex; flex-direction: column; gap: 7px; }
  .r { display: flex; align-items: baseline; gap: 16px; }
  .s { font-family: var(--cal-font-display); color: var(--cal-text); font-weight: 700; }
  .tag { font-family: var(--cal-font-mono); font-size: 11px; color: var(--cal-text-faint); margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
  <div class="stack">
    <div class="r"><span class="s" style="font-size:40px;font-weight:900;letter-spacing:-0.02em">Hero</span><span class="tag">56 / 900</span></div>
    <div class="r"><span class="s" style="font-size:28px;font-family:var(--cal-font-heading)">Heading H1</span><span class="tag">34 / 700</span></div>
    <div class="r"><span class="s" style="font-size:20px;font-family:var(--cal-font-heading);font-weight:600">Heading H2</span><span class="tag">24 / 600</span></div>
    <div class="r"><span class="s" style="font-size:15px;font-weight:600">Card title / item name</span><span class="tag">15 / 600</span></div>
    <div class="r"><span class="s" style="font-size:14px;font-weight:400;color:var(--cal-text-muted)">Body copy — match recaps &amp; rules</span><span class="tag">14 / 400</span></div>
    <div class="r"><span class="s" style="font-family:var(--cal-font-mono);font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--cal-text-faint)">Mono Label</span><span class="tag">11 / 600</span></div>
  </div>
</body>
</html>
