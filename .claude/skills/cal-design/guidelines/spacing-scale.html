<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cal-bg);padding:26px;display:flex;align-items:flex-end;gap:18px;font-family:var(--cal-font-mono)}
  .c{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{width:34px;background:var(--cal-gradient);border-radius:3px}
  .n{font-size:10px;color:var(--cal-text-faint)}
</style></head><body>
  <div class="c"><div class="bar" style="height:4px"></div><span class="n">1·4</span></div>
  <div class="c"><div class="bar" style="height:8px"></div><span class="n">2·8</span></div>
  <div class="c"><div class="bar" style="height:16px"></div><span class="n">4·16</span></div>
  <div class="c"><div class="bar" style="height:24px"></div><span class="n">6·24</span></div>
  <div class="c"><div class="bar" style="height:32px"></div><span class="n">8·32</span></div>
  <div class="c"><div class="bar" style="height:48px"></div><span class="n">12·48</span></div>
  <div class="c"><div class="bar" style="height:64px"></div><span class="n">16·64</span></div>
  <div class="c"><div class="bar" style="height:80px"></div><span class="n">20·80</span></div>
</body></html>
