<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="Tight dashboard rhythm — 14px signature gutter" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { background: var(--cal-gradient); border-radius: 3px; width: 16px; }
  .v { font-family: var(--cal-font-mono); font-size: 10px; color: var(--cal-text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="height:4px"></div><div class="v">4</div></div>
    <div class="col"><div class="box" style="height:8px"></div><div class="v">8</div></div>
    <div class="col"><div class="box" style="height:10px"></div><div class="v">10</div></div>
    <div class="col"><div class="box" style="height:12px"></div><div class="v">12</div></div>
    <div class="col"><div class="box" style="height:14px"></div><div class="v">14★</div></div>
    <div class="col"><div class="box" style="height:18px"></div><div class="v">18</div></div>
    <div class="col"><div class="box" style="height:20px"></div><div class="v">20</div></div>
    <div class="col"><div class="box" style="height:24px"></div><div class="v">24</div></div>
    <div class="col"><div class="box" style="height:32px"></div><div class="v">32</div></div>
    <div class="col"><div class="box" style="height:48px"></div><div class="v">48</div></div>
  </div>
</body>
</html>
