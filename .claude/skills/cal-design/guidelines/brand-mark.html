<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cal-bg);padding:28px;display:flex;align-items:center;gap:36px}
  .tile{width:104px;height:104px;border-radius:var(--cal-radius-tile);box-shadow:var(--cal-shadow-lg);flex:none}
  .wm{font-family:var(--cal-font-display);font-weight:900;font-size:64px;color:var(--cal-text);letter-spacing:-0.01em;line-height:1;text-shadow:-3px 0 0 rgba(0,229,255,.9), 3px 0 0 rgba(255,46,152,.9)}
  .tag{font-family:var(--cal-font-mono);font-size:11px;letter-spacing:0.32em;text-transform:uppercase;color:var(--cal-text-faint);margin-top:8px}
</style></head><body>
  <img class="tile" src="../assets/cal-mark.png" alt="CAL mark">
  <div>
    <div class="wm">CAL</div>
    <div class="tag">Champions Amateur League</div>
  </div>
</body></html>
