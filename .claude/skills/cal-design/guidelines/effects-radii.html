<!-- @dsCard group="Brand" viewport="700x170" name="Radii & Shadows" subtitle="Soft corners, deep ambient shadows, hairline top edge" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cal-bg);padding:30px;display:flex;gap:26px;align-items:center;font-family:var(--cal-font-mono)}
  .box{width:120px;height:84px;background:var(--cal-surface-2);border:1px solid var(--cal-border);
       display:flex;align-items:flex-end;padding:10px;color:var(--cal-text-faint);font-size:10px;letter-spacing:0.1em;text-transform:uppercase}
</style></head><body>
  <div class="box" style="border-radius:var(--cal-radius-sm);box-shadow:var(--cal-shadow-sm),var(--cal-edge-top)">sm · sm</div>
  <div class="box" style="border-radius:var(--cal-radius-md);box-shadow:var(--cal-shadow-md),var(--cal-edge-top)">md · md</div>
  <div class="box" style="border-radius:var(--cal-radius-lg);box-shadow:var(--cal-shadow-lg),var(--cal-edge-top)">lg · lg</div>
  <div class="box" style="border-radius:var(--cal-radius-xl);box-shadow:var(--cal-shadow-xl),var(--cal-edge-top)">xl · xl</div>
</body></html>
