# Bloodsport Open — Tournament Definition Language (TDL)
# Edit this file to configure your tournament. No code changes needed.

name: "Bloodsport Open"
format: single_elimination
players: 8
best_of: 3
third_place_match: false
seeding: trueskill         # trueskill | random | manual

rating:
  algorithm: trueskill
  mu_initial: 25.0
  sigma_initial: 8.333     # = 25/3
  beta: 4.167              # = 25/6 — skill separation factor
  tau: 0.083               # = 25/300 — rating volatility per game
  draw_probability: 0.0    # LoL has no draws

riot:
  region: NA1
  map: SUMMONERS_RIFT
  pick_type: TOURNAMENT_DRAFT
  spectator: ALL
