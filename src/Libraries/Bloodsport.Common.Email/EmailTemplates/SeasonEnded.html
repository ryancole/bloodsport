<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Season Complete</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; padding: 40px;">
          <tr>
            <td>
              <h1 style="color: #1a1a1a; margin-top: 0;">{{ season_name }} is over!</h1>
              <p style="color: #444; font-size: 16px; line-height: 1.6;">
                Congratulations to everyone who competed this season. Here's how <strong>{{ team_name }}</strong> finished:
              </p>
              <table cellpadding="0" cellspacing="0" style="width: 100%; margin: 24px 0;">
                <tr>
                  <td style="font-size: 32px; font-weight: bold; color: #1a1a1a; text-align: center;">{{ win_count }}W &ndash; {{ lose_count }}L</td>
                </tr>
              </table>
              <p style="color: #444; font-size: 16px; line-height: 1.6;">
                Head to the site to view the full standings.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
