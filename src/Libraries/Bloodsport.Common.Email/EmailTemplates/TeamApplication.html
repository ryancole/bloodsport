<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Application</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; padding: 40px;">
          <tr>
            <td>
              <h1 style="color: #1a1a1a; margin-top: 0;">New application to join your team</h1>
              <p style="color: #444; font-size: 16px; line-height: 1.6;">
                <strong>{{ applicant_name }}</strong> wants to join <strong>{{ team_name }}</strong>.
              </p>
              <p style="color: #444; font-size: 16px; line-height: 1.6;">
                Take a look at their profile, then head to your team's page to accept or decline the application.
              </p>
              <p style="margin: 28px 0;">
                <a href="{{ applicant_url }}" style="background-color: #0284c7; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; display: inline-block;">
                  View {{ applicant_name }}'s profile
                </a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
